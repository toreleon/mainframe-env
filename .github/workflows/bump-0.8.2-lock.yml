name: bump-0.8.2-lock

on:
  push:
    branches:
      - release/bump-0.8.2

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/bump-0.8.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Refresh Cargo.lock for workspace version bump
        run: cargo check --workspace
      - name: Commit refreshed lock and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git rm .github/workflows/bump-0.8.2-lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh lockfile for 0.8.2"
          git push origin HEAD:release/bump-0.8.2
