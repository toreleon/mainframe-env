[workspace]
members = [
    "crates/foundation/mainframe-env-source",
    "crates/foundation/mainframe-env-diagnostics",
    "crates/foundation/mainframe-env-encoding",
    "crates/foundation/mainframe-env-ir",
    "crates/contracts/mainframe-env-compiler-api",
    "crates/contracts/mainframe-env-execution-api",
    "crates/contracts/mainframe-env-host-api",
    "crates/contracts/mainframe-env-store-api",
    "crates/contracts/mainframe-env-coverage",
    "crates/stores/mainframe-env-store",
    "crates/kernel/mainframe-env-compiler",
    "crates/kernel/mainframe-env-interpreter",
    "crates/kernel/mainframe-env-application",
    "crates/providers/mainframe-env-dataset",
    "crates/providers/mainframe-env-racf",
    "crates/providers/mainframe-env-cics",
    "crates/providers/mainframe-env-db2",
    "crates/providers/mainframe-env-ims",
    "crates/providers/mainframe-env-mq",
    "crates/apps/mainframe-env-batch",
    "crates/gateways/mainframe-env-zosmf",
    "crates/apps/mainframe-env-server",
    "crates/apps/mainframe-env-cli",
    "crates/tooling/mainframe-env-conformance",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/toreleon/mainframe-env"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
proptest = "1"
rowan = "0.16"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "signal"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "postgres"] }
argon2 = "0.6"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tower = { version = "0.5", default-features = false, features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", default-features = false, features = ["limit", "trace", "request-id", "timeout"] }
base64 = "0.22"
tracing = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
ring = "0.17"

mainframe-env-source = { path = "crates/foundation/mainframe-env-source" }
mainframe-env-diagnostics = { path = "crates/foundation/mainframe-env-diagnostics" }
mainframe-env-encoding = { path = "crates/foundation/mainframe-env-encoding" }
mainframe-env-ir = { path = "crates/foundation/mainframe-env-ir" }
mainframe-env-compiler-api = { path = "crates/contracts/mainframe-env-compiler-api" }
mainframe-env-execution-api = { path = "crates/contracts/mainframe-env-execution-api" }
mainframe-env-host-api = { path = "crates/contracts/mainframe-env-host-api" }
mainframe-env-store-api = { path = "crates/contracts/mainframe-env-store-api" }
mainframe-env-coverage = { path = "crates/contracts/mainframe-env-coverage" }
mainframe-env-store = { path = "crates/stores/mainframe-env-store" }
mainframe-env-compiler = { path = "crates/kernel/mainframe-env-compiler" }
mainframe-env-interpreter = { path = "crates/kernel/mainframe-env-interpreter" }
mainframe-env-application = { path = "crates/kernel/mainframe-env-application" }
mainframe-env-dataset = { path = "crates/providers/mainframe-env-dataset" }
mainframe-env-racf = { path = "crates/providers/mainframe-env-racf" }
mainframe-env-cics = { path = "crates/providers/mainframe-env-cics" }
mainframe-env-db2 = { path = "crates/providers/mainframe-env-db2" }
mainframe-env-ims = { path = "crates/providers/mainframe-env-ims" }
mainframe-env-mq = { path = "crates/providers/mainframe-env-mq" }
mainframe-env-batch = { path = "crates/apps/mainframe-env-batch" }
mainframe-env-zosmf = { path = "crates/gateways/mainframe-env-zosmf" }
mainframe-env-server = { path = "crates/apps/mainframe-env-server" }
mainframe-env-conformance = { path = "crates/tooling/mainframe-env-conformance" }
