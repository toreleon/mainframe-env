name: offline-release-bundle

on:
  push:
    tags:
      - "mainframe-env-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the offline bundle to"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: offline-release-bundle-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  vendor-and-publish:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^mainframe-env-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "unsafe or unsupported release tag: $tag" >&2
            exit 1
          fi
          version="${tag#mainframe-env-v}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1

      - name: Verify VERSION matches tag
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.release.outputs.version }}"
          actual="$(tr -d '[:space:]' < VERSION)"
          if [[ "$actual" != "$expected" ]]; then
            echo "VERSION mismatch: tag=$expected repository=$actual" >&2
            exit 1
          fi

      - name: Install Rust 1.98.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Vendor locked Cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf offline-sdk vendor
          mkdir -p offline-sdk/.cargo
          cargo vendor --locked vendor > offline-sdk/.cargo/config.toml
          mv vendor offline-sdk/vendor
          cp Cargo.lock offline-sdk/Cargo.lock
          cp Cargo.toml offline-sdk/Cargo.toml
          cat > offline-sdk/README.md <<'EOF'
          # mainframe-env offline Cargo dependency bundle

          This archive contains the exact crates required by the release's `Cargo.lock`.

          To use it, extract the archive into the root of a matching mainframe-env source checkout, then copy `.cargo/` and `vendor/` into that checkout. Build with:

          ```bash
          cargo build --workspace --all-features --locked --offline
          cargo test --workspace --all-features --locked --offline
          ```

          The Rust compiler/toolchain is intentionally not included in this archive.
          EOF

      - name: Verify fully offline build against vendored sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cargo
          cp offline-sdk/.cargo/config.toml .cargo/config.toml
          cp -R offline-sdk/vendor ./vendor
          cargo build --workspace --all-features --locked --offline

      - name: Package bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          archive="mainframe-env-${version}-cargo-vendor.tar.gz"
          tar -C offline-sdk -czf "$archive" .
          sha256sum "$archive" > "${archive}.sha256"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Create release if necessary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --verify-tag \
              --title "mainframe-env ${version}" \
              --generate-notes
          fi

      - name: Upload offline Cargo bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.package.outputs.archive }}"
          gh release upload "${{ steps.release.outputs.tag }}" \
            "$archive" \
            "${archive}.sha256" \
            --clobber
