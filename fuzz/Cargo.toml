[package]
name = "mainframe-env-fuzz"
version = "0.8.3"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
mainframe-env-compiler = { path = "../crates/kernel/mainframe-env-compiler" }
mainframe-env-ir = { path = "../crates/foundation/mainframe-env-ir" }
mainframe-env-source = { path = "../crates/foundation/mainframe-env-source" }

[[bin]]
name = "cobol_parser"
path = "fuzz_targets/cobol_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ir_decoder"
path = "fuzz_targets/ir_decoder.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[profile.release]
debug = 1
