name: mainframe-env

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  dev:
    image: mainframe-env-toolchain:dev
    build:
      context: ..
      dockerfile: docker/toolchain.Dockerfile
      additional_contexts:
        jenkins-seed: ${MAINFRAME_ENV_JENKINS_SEED:?Run docker/dev init}
    profiles: [dev]
    init: true
    working_dir: /workspace
    entrypoint: [/opt/mainframe-env/docker/entrypoint.sh]
    environment:
      DEV_UID: ${MAINFRAME_ENV_UID:-1000}
      DEV_GID: ${MAINFRAME_ENV_GID:-1000}
      <<: &cargo-env
        CARGO_HOME: /cache
        CARGO_TARGET_DIR: /target
        TMPDIR: /target
        CARGO_INCREMENTAL: '0'
        CARGO_BUILD_JOBS: '2'
        CARGO_PROFILE_DEV_DEBUG: '0'
        CARGO_PROFILE_TEST_DEBUG: '0'
        RUSTUP_AUTO_INSTALL: '0'
        PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - type: bind
        source: ${MAINFRAME_ENV_SOURCE:?Run docker/dev}
        target: /workspace
      # Mask the large host target, even for tools that ignore CARGO_TARGET_DIR.
      - dev-target:/workspace/target
      - dev-target:/target
      - dev-cargo:/cache
      - dev-output:/workspace/dist
      - dev-postgres:/workspace/.postgres
    tmpfs: [/tmp:size=512m, /run:size=16m]
    mem_limit: 6g
    cpus: 3
    pids_limit: 512
    logging: *logging

  jenkins:
    image: mainframe-env-toolchain:dev
    build:
      context: ..
      dockerfile: docker/toolchain.Dockerfile
      additional_contexts:
        jenkins-seed: ${MAINFRAME_ENV_JENKINS_SEED:?Run docker/dev init}
    container_name: mainframe-env-jenkins
    init: true
    restart: unless-stopped
    entrypoint: [/opt/mainframe-env/docker/jenkins-entrypoint.sh]
    environment:
      <<: *cargo-env
      JENKINS_HOME: /state/jenkins
      MAINFRAME_ENV_CI_REPOSITORY: ${MAINFRAME_ENV_CI_REPOSITORY:-/source}
      MAINFRAME_ENV_CI_BRANCH: main
      MAINFRAME_ENV_CI_CREDENTIAL_ID: mainframe-env-github
      JAVA_OPTS: -Xms256m -Xmx1024m
    ports: ['127.0.0.1:18080:8080']
    volumes:
      - jenkins-home:/state
      - ci-cargo:/cache
      - ci-target:/target
      - releases:/releases
      - type: bind
        source: ${MAINFRAME_ENV_SOURCE:?Run docker/dev}
        target: /source
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock
    secrets: [jenkins_password, github_credentials]
    tmpfs: [/tmp:size=512m, /run:size=16m]
    mem_limit: 6g
    cpus: 3
    pids_limit: 1024
    logging: *logging
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/login]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: docker.io/library/postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    container_name: mainframe-env-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mainframe
      POSTGRES_DB: mainframe_env
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    # PostgreSQL 18's image stores its versioned PGDATA under /var/lib/postgresql.
    volumes: [postgres-data:/var/lib/postgresql]
    command: [postgres, -c, max_connections=40, -c, shared_buffers=128MB, -c, max_wal_size=512MB, -c, min_wal_size=80MB, -c, log_statement=none]
    shm_size: 128m
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, pg_isready -U mainframe -d mainframe_env]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    image: mainframe-env-runtime:dev
    build:
      context: ..
      dockerfile: docker/runtime.Dockerfile
    container_name: mainframe-env-server
    profiles: [runtime]
    init: true
    restart: unless-stopped
    read_only: true
    ports: ['127.0.0.1:10443:10443']
    volumes: [releases:/releases:ro]
    secrets: [postgres_password, admin_password]
    tmpfs: [/tmp:size=64m, /run:size=16m]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python3, /opt/mainframe-env/docker/runtime.py, health]
      interval: 5s
      timeout: 4s
      retries: 18
      start_period: 10s

volumes:
  dev-cargo:
  dev-target:
  dev-output:
  dev-postgres:
  ci-cargo:
  ci-target:
  jenkins-home:
  postgres-data:
  releases:

secrets:
  github_credentials:
    file: ${MAINFRAME_ENV_SECRETS:?Run docker/dev}/github_credentials
  jenkins_password:
    file: ${MAINFRAME_ENV_SECRETS:?Run docker/dev}/jenkins_password
  postgres_password:
    file: ${MAINFRAME_ENV_SECRETS:?Run docker/dev}/postgres_password
  admin_password:
    file: ${MAINFRAME_ENV_SECRETS:?Run docker/dev}/admin_password
