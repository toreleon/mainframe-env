[product]
name = "mainframe-env"
version = "0.6.0"
release_line = "0.6"
channel = "stable"
publish = false

[rust]
pinned = "1.98.0"
msrv = "1.95.0"
edition = "2024"

[profiles]
supported = ["core-server", "conformance"]

[contracts]
source_bundle = "mainframe-env.source@1"
diagnostics = "mainframe-env.diagnostic@1"
compiler = "mainframe-env.compiler@1"
ir_object = "mainframe-env.ir@1"
ir_text = "mainframe-env.ir-text@1"
ir_binary = "mainframe-env.ir-binary@1"
ir_envelope = "mainframe-env.ir-envelope@1"
artifact = "mainframe-env.artifact@1"
execution = "mainframe-env.execution@1"
host = "mainframe-env.host@1"
cics = "mainframe-env.cics@1"
checkpoint = "mainframe-env.checkpoint@1"
session = "mainframe-env.session@1"
configuration = "mainframe-env.config@1"
zosmf = "mainframe-env.zosmf@1"
evidence = "mainframe-env.evidence@1"
sql_schema = 1
migration_head = "0001-durable-state"

[artifacts]
content_address = "sha256"
sbom_format = "CycloneDX-1.6"
provenance_format = "SLSA-v1"
