name: mainframe-env

on:
  push:
    branches:
      - main
    tags:
      - "mainframe-env-v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 0"

permissions:
  contents: read

concurrency:
  group: mainframe-env-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/mainframe-env-v') }}

jobs:
  select-assurance:
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      build: ${{ steps.plan.outputs.build }}
      full: ${{ steps.plan.outputs.full }}
      msrv: ${{ steps.plan.outputs.msrv }}
      store: ${{ steps.plan.outputs.store }}
      mutation: ${{ steps.plan.outputs.mutation }}
      architecture: ${{ steps.plan.outputs.architecture }}
      evidence: ${{ steps.plan.outputs.evidence }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tools/tests -p test_ci_assurance.py
      - id: plan
        run: python3 -B tools/ci_assurance.py plan --output "$RUNNER_TEMP/ci-plan.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-plan.json
          if-no-files-found: error

  v0-foundation:
    needs: select-assurance
    if: needs.select-assurance.outputs.build == 'true'
    runs-on: ubuntu-24.04
    container:
      image: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
      # The workspace debug artifacts no longer fit alongside the toolchains
      # the runner image preinstalls for other ecosystems. Those live on the
      # host, so bind them in to let the first step reclaim the space.
      volumes:
        - /usr/local/lib/android:/reclaim/android
        - /opt/hostedtoolcache:/reclaim/hostedtoolcache
        - /usr/local/.ghcup:/reclaim/ghcup
        - /usr/share/swift:/reclaim/swift
        - /usr/share/dotnet:/reclaim/dotnet
        - /usr/local/share/powershell:/reclaim/powershell
        - /usr/lib/google-cloud-sdk:/reclaim/gcloud
    env:
      CARGO_INCREMENTAL: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Reclaim runner image disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          for dir in /reclaim/*/; do
            rm -rf "${dir:?}"* || true
          done
          df -h /
      - uses: actions/checkout@v7
        with:
          # Conformance verifies the accepted release tag and historical
          # phase/remediation commit trailers. The default one-commit checkout
          # omits both the required history and tags.
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.select-assurance.outputs.candidate }}
          persist-credentials: false
      # checkout's container-safe setting is written under a temporary HOME;
      # conformance invokes Git later from the job shell's persistent HOME.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Ensure receipt interpreter
        run: command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends python3)
      - name: Record the checked-out candidate and selected obligations
        run: python3 -B tools/ci_assurance.py plan --output target/ci-assurance/plan.json
      - name: Restore Rust build cache
        id: rust-cache
        if: >-
          github.event_name != 'pull_request' &&
          !startsWith(github.ref, 'refs/tags/mainframe-env-v')
        uses: actions/cache/restore@v6
        with:
          path: target/debug
          key: ${{ runner.os }}-rust-1.98.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98.0-
      - run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate fmt -- cargo fmt --all -- --check
      - run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate spec -- cargo xtask spec --check
      - run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate cobol -- cargo xtask cobol-exit --check
      - run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate tests --expect-tests -- cargo test --workspace --all-features --locked --no-fail-fast
      - run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate clippy -- cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check every workspace target
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate targets -- cargo check --workspace --all-targets --all-features --locked
      - name: Build workspace documentation
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate documentation -- env RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
      - name: Fast architecture (no release build)
        if: needs.select-assurance.outputs.architecture == 'true' && needs.select-assurance.outputs.full != 'true'
        run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate architecture-fast -- cargo xtask architecture-fast --check
      - name: Fast evidence consistency (not full certification)
        if: needs.select-assurance.outputs.evidence == 'true' && needs.select-assurance.outputs.full != 'true'
        run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate evidence-fast -- cargo xtask evidence-fast --check
      - name: Bounded reference-model source mutations
        if: needs.select-assurance.outputs.mutation == 'true'
        run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate mutation -- python3 -B tools/dataset_mutations.py --output target/ci-assurance/dataset-mutations --timeout 300
      - name: Check complete conformance
        if: needs.select-assurance.outputs.full == 'true'
        run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate conformance -- cargo xtask conformance --check
      - name: Check evidence seal
        if: needs.select-assurance.outputs.full == 'true'
        run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate evidence-seal -- cargo xtask evidence seal --check
      - name: Check runtime architecture
        if: needs.select-assurance.outputs.full == 'true'
        run: python3 -B tools/ci_assurance.py record --output target/ci-assurance --gate runtime-architecture -- cargo xtask runtime-architecture --check
      - name: Save trusted Rust build cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          !startsWith(github.ref, 'refs/tags/mainframe-env-v') &&
          steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Summarize exact-candidate command evidence
        if: always()
        run: python3 -B tools/ci_assurance.py summary --plan target/ci-assurance/plan.json --directory target/ci-assurance --output target/ci-assurance/summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-assurance/
          if-no-files-found: error
      - id: linux-release-path
        if: ${{ startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        shell: bash
        run: |
          version="$(<VERSION)"
          if [[ ! "$version" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "unsafe product VERSION: $version" >&2
            exit 1
          fi
          release_dir="release/$version/targets/x86_64-unknown-linux-gnu"
          printf 'path=%s\n' "$release_dir" >> "$GITHUB_OUTPUT"
      - if: ${{ startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        run: cargo xtask release --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v7
        if: ${{ always() && startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        with:
          name: linux-release-evidence
          path: ${{ steps.linux-release-path.outputs.path }}
          if-no-files-found: error
      - if: ${{ startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        run: git diff --exit-code -- "${{ steps.linux-release-path.outputs.path }}"
      - if: ${{ startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        run: cargo xtask release --check --target x86_64-unknown-linux-gnu

  contract-msrv:
    needs: select-assurance
    if: needs.select-assurance.outputs.msrv == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-assurance.outputs.candidate }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - run: >-
          cargo +1.95.0 check --locked
          -p mainframe-env-source
          -p mainframe-env-diagnostics
          -p mainframe-env-encoding
          -p mainframe-env-ir
          -p mainframe-env-compiler-api
          -p mainframe-env-execution-api
          -p mainframe-env-host-api
          -p mainframe-env-store-api


  backend-parity:
    needs: select-assurance
    if: needs.select-assurance.outputs.store == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hardening
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: mainframe_env
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hardening -d mainframe_env"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
      MAINFRAME_ENV_TEST_POSTGRES_URL: postgres://hardening:disposable-ci-only@localhost:5432/mainframe_env
      MAINFRAME_ENV_POSTGRES_TEST_URL: postgres://hardening:disposable-ci-only@localhost:5432/mainframe_env
    steps:
      # This job restores the same debug cache and builds against it, so it
      # needs the same headroom as v0-foundation. It runs directly on the
      # runner, so the unused toolchains are removable without bind mounts.
      - name: Reclaim runner image disk space
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/lib/google-cloud-sdk || true
          df -h /
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.select-assurance.outputs.candidate }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: actions/cache/restore@v6
        if: ${{ !startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        with:
          path: target/debug
          key: ${{ runner.os }}-rust-1.98.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98.0-
      - run: python3 -B tools/ci_assurance.py plan --output target/ci-backend/plan.json
      - name: Explicit PostgreSQL Move contract (not skipped-test credit)
        run: python3 -B tools/ci_assurance.py record --output target/ci-backend --gate postgres-move --expect-tests -- cargo test --locked -p mainframe-env-store --test provider_move_contract postgres_move_contract -- --ignored --exact
      - name: Versioned effect contract when present in this candidate
        run: |
          if test -f crates/stores/mainframe-env-store/tests/effect_encoding_contract.rs; then
            python3 -B tools/ci_assurance.py record --output target/ci-backend --gate postgres-effect --expect-tests -- cargo test --locked -p mainframe-env-store --test effect_encoding_contract postgres_effect_domains_cannot_be_mixed -- --ignored --exact
          fi
      - name: Summarize backend evidence
        if: always()
        shell: bash
        run: |
          gates=(postgres-move)
          if test -f crates/stores/mainframe-env-store/tests/effect_encoding_contract.rs; then gates+=(postgres-effect); fi
          python3 -B tools/ci_assurance.py summary --plan target/ci-backend/plan.json --directory target/ci-backend --output target/ci-backend/summary.json --gates "${gates[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-backend/
          if-no-files-found: error

  assurance-status:
    if: always()
    needs: [select-assurance, v0-foundation, contract-msrv, backend-parity]
    runs-on: ubuntu-24.04
    env:
      SELECT: ${{ needs.select-assurance.result }}
      BUILD_REQUIRED: ${{ needs.select-assurance.outputs.build }}
      BUILD: ${{ needs.v0-foundation.result }}
      MSRV_REQUIRED: ${{ needs.select-assurance.outputs.msrv }}
      MSRV: ${{ needs.contract-msrv.result }}
      BACKEND_REQUIRED: ${{ needs.select-assurance.outputs.store }}
      BACKEND: ${{ needs.backend-parity.result }}
      FULL: ${{ needs.select-assurance.outputs.full }}
    steps:
      - name: Require all selected tiers, and distinguish skipped work
        shell: bash
        run: |
          test "$SELECT" = success
          check() { if test "$1" = true; then test "$2" = success; else test "$2" = skipped; fi; }
          check "$BUILD_REQUIRED" "$BUILD"
          check "$MSRV_REQUIRED" "$MSRV"
          check "$BACKEND_REQUIRED" "$BACKEND"
          printf 'Selected CI tiers completed. full_tier=%s; skipped tiers grant no evidence credit.\n' "$FULL"
