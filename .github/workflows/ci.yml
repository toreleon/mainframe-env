name: mainframe-env

on:
  push:
    branches:
      - main
    tags:
      - "mainframe-env-v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mainframe-env-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/mainframe-env-v') }}

jobs:
  v0-foundation:
    runs-on: ubuntu-24.04
    container: rust:1.98.0-bookworm@sha256:82150a52ec202c1b14d7817e14516c392bb7f5cfebd88f1ed531cb37ebd39922
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Conformance verifies the accepted release tag and historical
          # phase/remediation commit trailers. The default one-commit checkout
          # omits both the required history and tags.
          fetch-depth: 0
          fetch-tags: true
      # checkout's container-safe setting is written under a temporary HOME;
      # conformance invokes Git later from the job shell's persistent HOME.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Restore Rust build cache
        if: ${{ !startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        uses: actions/cache@v4
        with:
          path: target/debug
          key: ${{ runner.os }}-rust-1.98.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98.0-
      - run: cargo fmt --all -- --check
      - run: cargo xtask spec --check
      - run: cargo xtask cobol-exit --check
      - run: cargo test --workspace --all-features --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check every workspace target
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Build workspace documentation
        if: ${{ github.event_name != 'pull_request' }}
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
      - name: Check complete conformance
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo xtask conformance --check
      - name: Check evidence seal
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo xtask evidence seal --check
      - name: Check runtime architecture
        if: ${{ github.event_name != 'pull_request' }}
        run: cargo xtask runtime-architecture --check
      - id: linux-release-path
        if: ${{ startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        shell: bash
        run: |
          version="$(<VERSION)"
          if [[ ! "$version" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "unsafe product VERSION: $version" >&2
            exit 1
          fi
          release_dir="release/$version/targets/x86_64-unknown-linux-gnu"
          printf 'path=%s\n' "$release_dir" >> "$GITHUB_OUTPUT"
      - if: ${{ startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        run: cargo xtask release --target x86_64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        if: ${{ always() && startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        with:
          name: linux-release-evidence
          path: ${{ steps.linux-release-path.outputs.path }}
          if-no-files-found: error
      - if: ${{ startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        run: git diff --exit-code -- "${{ steps.linux-release-path.outputs.path }}"
      - if: ${{ startsWith(github.ref, 'refs/tags/mainframe-env-v') }}
        run: cargo xtask release --check --target x86_64-unknown-linux-gnu

  contract-msrv:
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/mainframe-env-v') ||
      !startsWith(github.event.head_commit.message, 'Merge pull request #')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - run: >-
          cargo check --locked
          -p mainframe-env-source
          -p mainframe-env-diagnostics
          -p mainframe-env-encoding
          -p mainframe-env-ir
          -p mainframe-env-compiler-api
          -p mainframe-env-execution-api
          -p mainframe-env-host-api
          -p mainframe-env-store-api
