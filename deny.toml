[advisories]
unmaintained = "workspace"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  # ADR-0008 approves only this locked component and retained ICU text.
  { allow = ["ICU"], crate = "decnumber-sys@=0.1.6" },
]
unused-license-exception = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
