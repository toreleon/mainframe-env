name: publish-mainframe-env-0.8.2-tag

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  tag-0-8-2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Validate exact release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(<VERSION)"
          if [[ "$version" != "0.8.2" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "VERSION is $version, not 0.8.2; nothing to do."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Create and push annotated 0.8.2 tag
        if: ${{ steps.version.outputs.skip == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="mainframe-env-v0.8.2"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "mainframe-env 0.8.2"
          git push origin "refs/tags/$tag"
