name: mainframe-env

on:
  push:
  pull_request:

jobs:
  v0-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo xtask conformance --check
