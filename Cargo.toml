[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/toreleon/mainframe-env"

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
